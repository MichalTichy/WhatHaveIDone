name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore WhatHaveIDone.slnx
      - run: dotnet build WhatHaveIDone.slnx --no-restore -warnaserror
      - run: dotnet test WhatHaveIDone.slnx --no-build
