services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: what_have_i_done
      POSTGRES_USER: what_have_i_done
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U what_have_i_done -d what_have_i_done"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    profiles: [app]
    build: .
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DB: Host=db;Database=what_have_i_done;Username=what_have_i_done;Password=${POSTGRES_PASSWORD}
      DataProtection__Path: /data/keys
      Import__Path: /data/imports
    ports:
      - "127.0.0.1:${APP_PORT:-5088}:8080"
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  app-data:
