services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: what_have_i_done
      POSTGRES_USER: what_have_i_done
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U what_have_i_done -d what_have_i_done"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database:
